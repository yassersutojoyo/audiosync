# cargo-deny configuration for the Windows app.
#
# `cargo deny check licenses` (run from desktop/, and in CI) fails when any
# crate that goes into the x64 or ARM64 Windows build or the x64 Linux build,
# build and development dependencies included, is under a license that is not
# on this list.

[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.93
# Anything else needs a per-crate exception with a one-line reason, e.g.
# { crate = "name", allow = ["MPL-2.0"] }, # why it is acceptable
exceptions = [
    # AudioSync's own code is GPL-3.0-or-later; the exception names only our
    # own crates, so no third-party crate may bring a GPL license in.
    { crate = "audiosync-desktop", allow = ["GPL-3.0-or-later"] },
    { crate = "audiosync-core", allow = ["GPL-3.0-or-later"] },
    { crate = "audiosync-airplay", allow = ["GPL-3.0-or-later"] },
    { crate = "audiosync-cast", allow = ["GPL-3.0-or-later"] },
    { crate = "audiosync-remote", allow = ["GPL-3.0-or-later"] },
    # Slint's crates are "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR
    # LicenseRef-Slint-Software-3.0"; public builds take them under
    # GPL-3.0-only, which only Slint's crates may use.
    { crate = "i-slint-backend-selector", allow = ["GPL-3.0-only"] },
    { crate = "i-slint-backend-winit", allow = ["GPL-3.0-only"] },
    { crate = "i-slint-common", allow = ["GPL-3.0-only"] },
    { crate = "i-slint-compiler", allow = ["GPL-3.0-only"] },
    { crate = "i-slint-core", allow = ["GPL-3.0-only"] },
    { crate = "i-slint-core-macros", allow = ["GPL-3.0-only"] },
    { crate = "i-slint-renderer-femtovg", allow = ["GPL-3.0-only"] },
    { crate = "i-slint-renderer-software", allow = ["GPL-3.0-only"] },
    { crate = "slint", allow = ["GPL-3.0-only"] },
    { crate = "slint-build", allow = ["GPL-3.0-only"] },
    { crate = "slint-macros", allow = ["GPL-3.0-only"] },
    # Slint's core (i-slint-core) shows a system tray through it on Linux; the
    # Unlicense is a public-domain dedication with no conditions.
    { crate = "ksni", allow = ["Unlicense"] },
]
include-dev = true
include-build = true
# The list is a policy, not an inventory: a license nobody uses yet is fine.
unused-allowed-license = "allow"

[licenses.private]
ignore = false
