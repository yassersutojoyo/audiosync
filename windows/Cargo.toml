[package]
name = "audiosync-windows"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "AudioSync for Windows 11 (in development)."
repository = "https://github.com/yassersutojoyo/audiosync"
publish = false

[[bin]]
name = "audiosync"
path = "src/main.rs"

[dependencies]
audiosync-core = { path = "../core" }
# Used under the Slint Royalty-free Desktop, Mobile, and Web Applications
# License 2.0, checked for the 1.18 line; see THIRD_PARTY_NOTICES.md.
# unstable-winit-030: the winit window behind a Slint window, to focus it and
# to close the tray flyout when it loses focus. Pinned to the 1.18 line, like
# Slint itself.
slint = { version = "~1.18.1", features = ["unstable-winit-030"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Wdk_System_SystemServices",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }
# The notification-area icon and its menu (MIT OR Apache-2.0).
tray-icon = { version = "0.26.1", default-features = false }

[build-dependencies]
embed-resource = "3.0.12"
slint-build = "~1.18.1"
