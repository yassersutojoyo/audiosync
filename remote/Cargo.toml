[package]
name = "audiosync-remote"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "AudioSync's web remote: a small HTTP/1.1 server on the home network that serves one page and a JSON and Server-Sent Events API, so a paired phone can switch speakers, set their volume and delay and the master volume."
repository = "https://github.com/yassersutojoyo/audiosync"
publish = false

[dependencies]
# Pairing codes and device tokens.
getrandom = "0.4.3"
# The snapshot, the commands and the paired-device file, read and built as values.
serde_json = { version = "1.0.140", default-features = false, features = ["std"] }
# Device token hashes and the page's Content-Security-Policy hashes.
sha2 = { version = "0.11.0", default-features = false }
# An IPv6 listener that takes IPv6 only, on every OS.
socket2 = "0.6.5"
