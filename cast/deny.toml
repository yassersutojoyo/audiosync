# cargo-deny configuration for audiosync-cast.
#
# `cargo deny check licenses` (run from cast/, and in CI) fails when any
# crate in the build graph, development dependencies included, is under a
# license that is not on this list. The sender itself is GPL-3.0-or-later;
# third-party crates must be permissive. The list mirrors core/deny.toml.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.93
exceptions = [
    # AudioSync's own code is GPL-3.0-or-later; the exception names only our
    # own crate, so no third-party crate may bring a GPL license in.
    { crate = "audiosync-cast", allow = ["GPL-3.0-or-later"] },
]
# Test and build tools are held to the same list as the library.
include-dev = true
include-build = true
# The list is a policy, not an inventory: a license nobody uses yet is fine.
unused-allowed-license = "allow"

[licenses.private]
ignore = false

# Gates main and integ/* in the Licenses job, weekly in advisories.yml; every ignore says why.
[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    # A dev-dependency that only generates the fake receiver's test key; ring
    # signs with it, and no shipped code runs RSA.
    { id = "RUSTSEC-2023-0071", reason = "rsa only makes a test key; Marvin needs RSA decryption; no patched rsa version exists" },
    # heapless 0.8 comes only through flacenc 0.5.1, the latest release, which pins ^0.8;
    # flacenc uses heapless::Vec of i32, f64 and u8 alone. Remove once it moves to >=0.9.4.
    { id = "RUSTSEC-2026-0574", reason = "heapless 0.8 via flacenc, no patched version reachable (2026-11-19); FindMutView::pop is never called" },
    { id = "RUSTSEC-2026-0575", reason = "heapless 0.8 via flacenc, no patched version reachable (2026-11-19); Spsc::peek is never called" },
    { id = "RUSTSEC-2026-0576", reason = "heapless 0.8 via flacenc, no patched version reachable (2026-11-19); IndexMap::truncate is never called" },
    { id = "RUSTSEC-2026-0577", reason = "heapless 0.8 via flacenc, no patched version reachable (2026-11-19); panicking Drop in Deque, HistoryBuf, IndexMap and vec::IntoIter is never called" },
    { id = "RUSTSEC-2026-0578", reason = "heapless 0.8 via flacenc, no patched version reachable (2026-11-19); SortedLinkedList::zeroize is never called" },
    { id = "RUSTSEC-2026-0579", reason = "heapless 0.8 via flacenc, no patched version reachable (2026-11-19); Deque::try_from is never called" },
    { id = "RUSTSEC-2026-0580", reason = "heapless 0.8 via flacenc, no patched version reachable (2026-11-19); the pool allocators is never called" },
    { id = "RUSTSEC-2026-0581", reason = "heapless 0.8 via flacenc, no patched version reachable (2026-11-19); Deque::make_contiguous is never called" },
    { id = "RUSTSEC-2026-0582", reason = "heapless 0.8 via flacenc, no patched version reachable (2026-11-19); IndexMap::insert is never called" },
]

[bans]
wildcards = "deny"
# Duplicates come from upstream crates we do not control.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
