name: Field report (Mac)
description: You tried AudioSync 0.5.0 on your Mac. Tell me what you used and whether sync held, good or bad.
labels: ["field report"]
body:
  - type: markdown
    attributes:
      value: |
        This is for reports from real setups, including ones where everything worked. If something broke, the "Something's wrong" form fits better.

  - type: input
    id: app-version
    attributes:
      label: AudioSync version
      description: It's in the About panel.
      placeholder: "0.5.0"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.6"
    validations:
      required: true

  - type: input
    id: mac-model
    attributes:
      label: Mac model
      description: Apple menu > About This Mac.
      placeholder: "MacBook Air M2, 2022"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Audio source
      options:
        - All System Audio
        - One app
        - An input device
    validations:
      required: true

  - type: checkboxes
    id: output-types
    attributes:
      label: Output types you used
      options:
        - label: Built-in speakers or headphone jack
        - label: USB
        - label: Bluetooth
        - label: AirPlay
        - label: HDMI or DisplayPort

  - type: textarea
    id: outputs
    attributes:
      label: Outputs and their delays
      description: One line per output that was on, with its make and model if you know it, and the delay you set. Write 0 ms for outputs you left alone.
      placeholder: |
        MacBook Air speakers: 0 ms
        Sony WH-1000XM4 (Bluetooth): -220 ms
        HomePod mini (AirPlay): 0 ms
    validations:
      required: true

  - type: dropdown
    id: sync-held
    attributes:
      label: Did sync hold?
      options:
        - Yes, the whole time
        - It drifted after a while
        - It was never in sync
        - Not sure
    validations:
      required: true

  - type: input
    id: duration
    attributes:
      label: How long you listened
      description: If it drifted, also roughly when.
      placeholder: "About 2 hours, drifted after 40 minutes"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Dropouts, crackles, a speaker that took long to join, what you played.

  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: |
        Quit AudioSync, then start it in Terminal with its debug log on:
        `AUDIOSYNC_DEBUG=1 /Applications/AudioSync.app/Contents/MacOS/AudioSync`
        Listen as usual, quit, and drag `/tmp/audiosync-debug.log` in here. The log starts over at every launch.

        The log lists your outputs and the AirPlay speakers on your network by name, and speakers are often named after people. It also lists each AirPlay speaker's ID, which is usually its hardware address. Look it over and replace anything you'd rather not post before attaching it.
