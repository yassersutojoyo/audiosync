name: Cast

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to a feature branch cancels that branch's older run; every
# commit on main keeps its own group, so main's runs are never cancelled.
# The group starts with the file name, which stays unique when a name: is copied.
concurrency:
  group: cast.yml-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows run on main, integ/* trains and release/ branches; other pushes test on Linux only.
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integ/') || startsWith(github.ref, 'refs/heads/release/')) && '["ubuntu-latest","macos-15","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # Debug test builds bind every address only with this, as the apps do;
      # without it (a plain run on a desktop) they keep to loopback.
      AUDIOSYNC_LAN_TESTS: '1'
    defaults:
      run:
        shell: bash
        working-directory: cast
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      # native-tls uses the system OpenSSL on Linux; SChannel and Secure
      # Transport need nothing extra.
      - name: OpenSSL headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests (including the spec coverage check against docs/CAST_SPEC.md)
        run: cargo test --locked

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cast
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Only permissive licenses, dev-dependencies included (cast/deny.toml)
        run: cargo deny --locked check licenses
