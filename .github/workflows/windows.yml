name: Windows

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to a feature branch cancels that branch's older run; every
# commit on main keeps its own group, so main's runs are never cancelled.
# The group starts with the file name, which stays unique when a name: is copied.
concurrency:
  group: windows.yml-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # A warning in a .slint file fails the build, like a Rust warning in clippy.
  SLINT_COMPILER_DENY_WARNINGS: '1'

jobs:
  test:
    name: Format, clippy and tests
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

  # The same crate on Linux: the UI-only build without an audio backend, the
  # mock-backend build, and the tests.
  linux:
    name: Linux (format, clippy and tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      # Slint's fonts and windows, the Cast sender's native-tls (OpenSSL), and
      # the PipeWire client library with libclang for its bindings. The
      # daemon, WirePlumber and the pw-* tools run the capture's smoke test.
      - name: System libraries
        run: >-
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libssl-dev pkg-config
          libpipewire-0.3-dev clang libclang-dev
          pipewire pipewire-bin wireplumber dbus dbus-user-session

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Every check reports, even after one failed.
      - name: Clippy (mock-backend)
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets --features mock-backend -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test --locked

      # A PipeWire daemon of its own with two null sinks, each playing a 440 Hz
      # tone of its own level, and the ignored tests that capture the default
      # output's monitor and follow a change of the default. The tones are
      # linked by hand: WirePlumber moves even a targeted pw-play to a new
      # default output.
      - name: PipeWire capture smoke test
        if: ${{ !cancelled() }}
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          python3 -c "
          import math, struct, sys, wave
          for name, level in (('loud', 16000), ('quiet', 3000)):
              with wave.open(sys.argv[1] + '/' + name + '.wav', 'wb') as f:
                  f.setnchannels(2); f.setsampwidth(2); f.setframerate(48000)
                  f.writeframes(b''.join(struct.pack('<hh', s, s) for s in (int(level * math.sin(2 * math.pi * 440 * n / 48000)) for n in range(48000 * 120))))
          " "$RUNNER_TEMP"
          dbus-run-session -- bash -euo pipefail -c '
            pipewire & sleep 1
            wireplumber & sleep 2
            for sink in ci-loud ci-quiet; do
              pw-cli create-node adapter "{ factory.name=support.null-audio-sink node.name=$sink media.class=Audio/Sink object.linger=true audio.position=[FL FR] }"
            done
            sleep 1
            wpctl status
            for level in loud quiet; do
              pw-play --target 0 -P "{ node.name = ci-$level-tone }" "$RUNNER_TEMP/$level.wav" &
            done
            sleep 1
            for level in loud quiet; do
              for channel in FL FR; do
                pw-link "ci-$level-tone:output_$channel" "ci-$level:playback_$channel"
              done
            done
            pw-link -l
            failed=0
            for round in 1 2 3 4; do
              echo "round $round"
              cargo test --locked -- --ignored --test-threads 1 --nocapture audio::pipewire::stream::tests:: || failed=1
            done
            exit $failed
          '

  build:
    name: Release build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable, with the ${{ matrix.target }} target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: The executable carries the manifest and the version information
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target/${{ matrix.target }}/release/audiosync.exe").Path
          # The manifest is stored as plain text in the executable.
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          foreach ($entry in '{8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a}', 'PerMonitorV2') {
            if (-not $text.Contains($entry)) { throw "the embedded manifest lacks $entry" }
          }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($info.ProductName -ne 'AudioSync') { throw "unexpected product name '$($info.ProductName)'" }
          "audiosync.exe $($info.ProductVersion) for ${{ matrix.arch }}: manifest and version information present"

      # The license notices for everything compiled into audiosync.exe, from
      # Cargo.lock; fails if a crate's license isn't on desktop/deny.toml's list.
      - name: Third-party notices (THIRD-PARTY-NOTICES.txt)
        run: python -I ../scripts/windows_notices.py ${{ matrix.target }}

      - name: Upload audiosync.exe and its notices (workflow artifact, not a release)
        uses: actions/upload-artifact@v5
        with:
          name: audiosync-windows-${{ matrix.arch }}
          path: |
            desktop/target/${{ matrix.target }}/release/audiosync.exe
            desktop/target/${{ matrix.target }}/release/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          # Test builds only: every push makes new ones, so a week is plenty.
          retention-days: 7

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Permissive licenses, plus GPL for our own crates and Slint only (desktop/deny.toml)
        run: cargo deny --locked check licenses
