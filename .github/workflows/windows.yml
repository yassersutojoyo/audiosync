name: Windows

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to a feature branch cancels that branch's older run; every
# commit on main keeps its own group, so main's runs are never cancelled.
# The group starts with the file name, which stays unique when a name: is copied.
concurrency:
  group: windows.yml-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # A warning in a .slint file fails the build, like a Rust warning in clippy.
  SLINT_COMPILER_DENY_WARNINGS: '1'
  # Debug test builds bind every address only with this, as the app does;
  # without it (a plain run on a desktop) they keep to loopback.
  AUDIOSYNC_LAN_TESTS: '1'

jobs:
  test:
    name: Format, clippy and tests
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

  # The same crate on Linux: the PipeWire build, the mock-backend build, the
  # tests and the capture's smoke test.
  linux:
    name: Linux (format, clippy and tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      # Slint's fonts and windows, the Cast sender's native-tls (OpenSSL), and
      # dbus-run-session for the now-playing tests' private session bus, and
      # the PipeWire client library with libclang for its bindings. The
      # daemon, WirePlumber and the pw-* tools run the live tests; the
      # PulseAudio server and paplay play the PulseAudio-API app. avahi-daemon
      # and its tools share mDNS port 5353 with the app's discovery.
      - name: System libraries
        run: >-
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libssl-dev pkg-config
          libpipewire-0.3-dev clang libclang-dev
          pipewire pipewire-bin wireplumber dbus dbus-user-session pipewire-pulse pulseaudio-utils
          avahi-daemon avahi-utils iproute2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Every check reports, even after one failed.
      - name: Clippy (mock-backend)
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets --features mock-backend -- -D warnings

      # The MPRIS tests serve fake players on a session bus of their own.
      - name: Tests
        if: ${{ !cancelled() }}
        run: dbus-run-session -- cargo test --locked

      # A PipeWire daemon of its own with two null sinks, each playing a 440 Hz
      # tone of its own level, and the ignored tests that capture the default
      # output's monitor and follow a change of the default. The tones are
      # linked by hand: WirePlumber moves even a targeted pw-play to a new
      # default output. They ask for the capture's 1024-frame quantum: at
      # pw-play's default 100 ms they failed every cycle and played silence.
      - name: PipeWire capture smoke test
        if: ${{ !cancelled() }}
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          python3 -c "
          import math, struct, sys, wave
          for name, level in (('loud', 16000), ('quiet', 3000)):
              with wave.open(sys.argv[1] + '/' + name + '.wav', 'wb') as f:
                  f.setnchannels(2); f.setsampwidth(2); f.setframerate(48000)
                  f.writeframes(b''.join(struct.pack('<hh', s, s) for s in (int(level * math.sin(2 * math.pi * 440 * n / 48000)) for n in range(48000 * 120))))
          " "$RUNNER_TEMP"
          dbus-run-session -- bash -euo pipefail -c '
            pipewire & sleep 1
            wireplumber & sleep 2
            for sink in ci-loud ci-quiet; do
              pw-cli create-node adapter "{ factory.name=support.null-audio-sink node.name=$sink media.class=Audio/Sink object.linger=true audio.position=[FL FR] }"
            done
            sleep 1
            wpctl status
            for level in loud quiet; do
              pw-play --target 0 --latency 1024 -P "{ node.name = ci-$level-tone }" "$RUNNER_TEMP/$level.wav" &
            done
            sleep 1
            for level in loud quiet; do
              for channel in FL FR; do
                pw-link "ci-$level-tone:output_$channel" "ci-$level:playback_$channel"
              done
            done
            pw-link -l
            cargo test --locked -- --ignored --test-threads 1 audio::pipewire::stream::tests::
          '

      # A daemon of its own, with its PulseAudio server for paplay, and two
      # null sinks, as-a (the default) and as-b, for the outputs, the linked
      # captures and their timing, and the whole system's capture heard by
      # the airplay and cast crates' mock receivers.
      - name: PipeWire outputs and capture tests
        if: ${{ !cancelled() }}
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-outputs"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -euo pipefail -c '
            pipewire & sleep 1
            wireplumber & sleep 2
            pipewire-pulse & sleep 1
            for sink in a b; do
              upper=$(echo "$sink" | tr a-z A-Z)
              pw-cli create-node adapter "{ factory.name=support.null-audio-sink node.name=as-$sink node.description=\"AudioSync $upper\" media.class=Audio/Sink object.linger=true audio.position=[FL FR] }"
            done
            sleep 1
            wpctl status
            cargo test --locked -- --ignored --test-threads 1 audio::pipewire::live_tests::
          '

      # avahi-daemon holds UDP 5353 and publishes an AirPlay and a Cast
      # service; the app's mDNS binds next to it, resolves both and
      # announces a service avahi-browse lists.
      - name: mDNS next to avahi-daemon
        if: ${{ !cancelled() }}
        run: |
          sudo systemctl start avahi-daemon
          systemctl is-active avahi-daemon
          avahi-publish -s 0123456789AB@AudioSyncCI _raop._tcp 7000 \
            txtvers=1 ch=2 cn=0 et=0 sr=44100 ss=16 tp=UDP md=0,1,2 &
          avahi-publish -s AudioSyncCICast _googlecast._tcp 8009 \
            id=0123456789abcdef0123456789abcdef md=Chromecast fn=AudioSyncCICast &
          sleep 2
          ss -H -u -a -n 'sport = :5353'
          status=0
          cargo test --locked -- --ignored --exact audio::mdns_live_tests::mdns_shares_port_5353_with_avahi || status=$?
          jobs -p | xargs -r kill
          exit $status

      # A daemon of its own again, since these tests stop and start it and
      # WirePlumber.
      - name: PipeWire restart tests
        if: ${{ !cancelled() }}
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-restart"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -euo pipefail -c '
            pipewire & sleep 1
            wireplumber & sleep 2
            for sink in a b; do
              pw-cli create-node adapter "{ factory.name=support.null-audio-sink node.name=as-$sink media.class=Audio/Sink object.linger=true audio.position=[FL FR] }"
            done
            sleep 1
            cargo test --locked -- --ignored --test-threads 1 audio::pipewire::restart_tests::
          '

  build:
    name: Release build (${{ matrix.arch }})
    # No artifact from a run whose tests or license check failed.
    needs: [test, licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable, with the ${{ matrix.target }} target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: Build
        # Only a push to main or to a release/ branch marks the exe as a release
        # build, the one kind whose updater checks (docs/ENGINE_SPEC.md S293);
        # other branch builds stay unmarked.
        env:
          AUDIOSYNC_RELEASE_BUILD: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && '1' || '' }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: The executable carries the manifest and the version information
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target/${{ matrix.target }}/release/audiosync.exe").Path
          # The manifest is stored as plain text in the executable.
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          foreach ($entry in '{8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a}', 'PerMonitorV2') {
            if (-not $text.Contains($entry)) { throw "the embedded manifest lacks $entry" }
          }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($info.ProductName -ne 'AudioSync') { throw "unexpected product name '$($info.ProductName)'" }
          "audiosync.exe $($info.ProductVersion) for ${{ matrix.arch }}: manifest and version information present"

      # The license notices for everything compiled into audiosync.exe, from
      # Cargo.lock; fails if a crate's license isn't on desktop/deny.toml's list.
      - name: Third-party notices (THIRD-PARTY-NOTICES.txt)
        run: python -I ../scripts/windows_notices.py ${{ matrix.target }}

      - name: Upload audiosync.exe and its notices (workflow artifact, not a release)
        uses: actions/upload-artifact@v5
        with:
          name: audiosync-windows-${{ matrix.arch }}
          path: |
            desktop/target/${{ matrix.target }}/release/audiosync.exe
            desktop/target/${{ matrix.target }}/release/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          # Test builds only: every push makes new ones, so a week is plenty.
          retention-days: 7

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Permissive licenses, plus GPL for our own crates and Slint only (desktop/deny.toml)
        run: cargo deny --locked check licenses
