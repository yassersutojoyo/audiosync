name: Stranger

# A stranger's machine: the package a release ships, installed on a clean
# runner, launched, played to a receiver once and uninstalled. Runs on every
# train and on main; a manual run tries any branch.
on:
  push:
    branches: [main, 'integ/**']
  workflow_dispatch:

# Every commit on main keeps its own group, so main's runs are never cancelled.
concurrency:
  group: stranger.yml-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  SLINT_COMPILER_DENY_WARNINGS: '1'
  # As in linux.yml: the oldest glibc the packages run on.
  GLIBC_FLOOR: '2.39'
  # Skia built with the static C runtime, restored from the cache skia.yml fills.
  SKIA_BINARIES_URL: file://${{ github.workspace }}/skia-cache/{tag}/skia-binaries-{key}.tar.gz

jobs:
  proven:
    # main skips the rest for a commit this workflow already passed on an integ/* train.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Was this commit green on an integ/* train?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          SHA: ${{ github.sha }}
        # Any API error leaves skip=false, so main runs everything.
        run: |
          skip=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            wf=${WORKFLOW_REF%@*}
            if n=$(gh api "repos/$REPO/actions/workflows/${wf##*/}/runs?head_sha=$SHA&status=success&per_page=100" \
                --jq '[.workflow_runs[] | select(.event == "push" and .head_repository.full_name == $ENV.REPO and (.head_branch | startswith("integ/")))] | length') &&
              [ "$n" -gt 0 ] 2>/dev/null; then
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux stranger (${{ matrix.distro }}, receiver latency ${{ matrix.latency }})
    needs: proven
    if: needs.proven.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        # ubuntu installs the .deb on the runner itself; fedora installs the
        # .rpm in a Fedora 43 container on the runner's network.
        distro: [ubuntu, fedora]
        # The fake receiver adds the latency it reports, as the app's model
        # has it; once on ubuntu it doesn't, and plays that much early.
        latency: [added]
        include:
          - distro: ubuntu
            latency: not-added
    # The release's build host (linux.yml): a newer image links a newer glibc.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WORK: ${{ github.workspace }}/stranger-work
      DISTRO: ${{ matrix.distro }}
      RX_LATENCY: ${{ matrix.latency }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: The heard-once check tells once from twice (heard.py --self-test)
        run: python3 -I scripts/stranger/heard.py --self-test

      - name: Rust toolchain (1.99.1)
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      # Build: as linux.yml. On ubuntu the session's desktop stand-ins:
      # PipeWire, WirePlumber, its PulseAudio server and tools, Xvfb, a session
      # bus and the X11 libraries winit loads.
      - name: System packages
        run: |
          packages="libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libssl-dev pkg-config
            libpipewire-0.3-dev clang libclang-dev rpm"
          if [ "$DISTRO" = ubuntu ]; then
            packages="$packages pipewire pipewire-bin wireplumber pipewire-pulse pulseaudio-utils
              dbus dbus-user-session xvfb libx11-xcb1 libxcursor1 libxkbcommon-x11-0 libxi6 libxrandr2"
          fi
          sudo apt-get update -q
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $packages

      # The build a release ships, with its updater, so the updates screens
      # reach Check for Updates… from any branch.
      - name: Release build, the package, the stand-in tray host and receiver
        working-directory: desktop
        env:
          AUDIOSYNC_RELEASE_BUILD: '1'
        run: |
          cargo build --locked --release
          top=$(objdump -T target/release/audiosync | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "Highest glibc symbol version: $top (floor $GLIBC_FLOOR)"
          [ "$(printf '%s\n' "$top" "$GLIBC_FLOOR" | sort -V | tail -1)" = "$GLIBC_FLOOR" ] || { echo "the program needs glibc $top, newer than the $GLIBC_FLOOR floor"; exit 1; }
          cargo build --locked --release --example sni_watcher_stub
          cargo build --locked --release --manifest-path ../airplay/Cargo.toml --example stranger_rx
          python3 -I ../scripts/windows_notices.py x86_64-unknown-linux-gnu --output target/release/THIRD-PARTY-NOTICES.txt
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "audiosync-desktop"))')
          mkdir -p ../dist
          if [ "$DISTRO" = ubuntu ]; then
            ../scripts/build_deb.sh target/release/audiosync target/release/THIRD-PARTY-NOTICES.txt "$version" \
              "../dist/AudioSync-$version-amd64.deb"
          else
            ../scripts/build_rpm.sh target/release/audiosync target/release/THIRD-PARTY-NOTICES.txt "$version" \
              "../dist/AudioSync-$version-x86_64.rpm"
          fi

      - name: Keep the package and the stand-in watcher for the screen jobs
        if: matrix.distro == 'ubuntu' && matrix.latency == 'added'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: stranger-linux-package
          path: |
            dist/AudioSync-*.deb
            desktop/target/release/examples/sni_watcher_stub
          if-no-files-found: error
          retention-days: 1

      - name: Receiver (the fake AirPlay 1 receiver, recorded)
        run: |
          if [ "$RX_LATENCY" = added ]; then
            scripts/stranger/linux_receiver.sh start "$WORK" airplay/target/release/examples/stranger_rx
          else
            scripts/stranger/linux_receiver.sh start "$WORK" airplay/target/release/examples/stranger_rx --latency-not-added
          fi

      - name: Install, launch, stream, quit and uninstall
        run: |
          stub=$PWD/desktop/target/release/examples/sni_watcher_stub
          if [ "$DISTRO" = ubuntu ]; then
            deb=$(ls dist/AudioSync-*.deb)
            sudo apt-get install -y "./$deb"
            dpkg-query -W audiosync | tee -a "$WORK/env.pkg.txt"
            scripts/stranger/linux_session.sh "$WORK" "$stub" sudo apt-get remove -y audiosync
          else
            rpm=$(basename "$(ls dist/AudioSync-*.rpm)")
            echo "package: $rpm" | tee -a "$WORK/env.pkg.txt"
            # The repository at its own path, so the session writes where the host reads;
            # what root writes there goes back to the runner's user for the upload.
            docker run --rm --network host -v "$PWD:$PWD:ro" -v "$WORK:$WORK" -w "$PWD" \
              -e RPM="$rpm" -e WORK="$WORK" -e STUB="$stub" -e OWNER="$(id -u):$(id -g)" fedora:43 bash -euo pipefail -c '
                trap "chown -R $OWNER $WORK" EXIT
                dnf install -y -q "dist/$RPM" pipewire wireplumber pipewire-pulseaudio pipewire-utils \
                  pulseaudio-utils xorg-x11-server-Xvfb dbus-daemon python3 procps-ng findutils \
                  libxkbcommon-x11 libXcursor libXi libXrandr libX11-xcb dejavu-sans-fonts
                scripts/stranger/linux_session.sh "$WORK" "$STUB" dnf remove -y -q audiosync'
          fi

      - name: Heard once on the receiver and the stand-in PC speaker, both on, within 15 ms (of -50 ms with the latency not added)
        if: ${{ !cancelled() }}
        run: |
          scripts/stranger/linux_receiver.sh stop "$WORK"
          echo "--- environment"
          cat "$WORK/env.txt" "$WORK/receiver-env.txt" "$WORK/env.pkg.txt" 2>/dev/null || true
          label="$(sed -n 's/^os: //p' "$WORK/env.txt"), PipeWire $(sed -n 's/^pipewire: //p' "$WORK/env.txt")"
          # The fake reports 2205 frames, 50 ms; one that doesn't add them plays 50 ms early.
          expect=0
          [ "$RX_LATENCY" = added ] || expect=-50
          python3 -I scripts/stranger/heard.py check --label "$label" --max-offset-ms 15 --expect-offset-ms "$expect" \
            --receiver "$WORK/receiver.wav" "$WORK/receiver.stamps" \
            --sink "$WORK/sink.wav" "$WORK/sink.stamps"

      - name: Upload the recordings and logs (workflow artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: stranger-linux-${{ matrix.distro }}-${{ matrix.latency }}
          path: |
            stranger-work/*.txt
            stranger-work/*.log
            stranger-work/*.out
            stranger-work/*.wav
            stranger-work/*.stamps
            stranger-work/state/**/*debug.log
          if-no-files-found: warn
          retention-days: 7

  skia:
    # Builds and caches Skia only when the cache misses.
    needs: proven
    if: needs.proven.outputs.skip != 'true'
    uses: ./.github/workflows/skia.yml

  windows:
    name: Windows stranger (install, launch, uninstall)
    needs: [proven, skia]
    if: needs.proven.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Rust toolchain (1.99.1)
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustup target add x86_64-pc-windows-msvc

      - name: Skia cache key
        id: skia
        run: echo "key=$(bash scripts/skia_cache_key.sh x86_64-pc-windows-msvc)" >> "$GITHUB_OUTPUT"

      - name: Skia (stored by skia.yml)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: skia-cache
          key: ${{ steps.skia.outputs.key }}
          fail-on-cache-miss: true

      # A push to main makes the build the updater runs in, as windows.yml does.
      - name: Release build and notices
        working-directory: desktop
        env:
          AUDIOSYNC_RELEASE_BUILD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '' }}
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc
          python -I ../scripts/windows_notices.py x86_64-pc-windows-msvc

      # Pinned and checked by hash, as in windows.yml.
      - name: Inno Setup 6.7.3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/innosetup.exe" https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          echo "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732  $RUNNER_TEMP/innosetup.exe" | sha256sum -c
          MSYS2_ARG_CONV_EXCL="*" "$RUNNER_TEMP/innosetup.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER

      - name: Installer (AudioSync-Setup.exe, as the release ships it)
        working-directory: desktop
        run: bash ../scripts/build_installer.sh x64 target/x86_64-pc-windows-msvc/release target/installer-x64

      - name: Keep the installer for the screen jobs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: stranger-windows-setup
          path: desktop/target/installer-x64/AudioSync-Setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Silent install, launch, screenshot, uninstall, default output as found
        shell: pwsh
        run: ./scripts/stranger/windows_run.ps1 -Setup desktop/target/installer-x64/AudioSync-Setup.exe -Work stranger-work

      # A10.03: the real launch check and notice, the feed served on 127.0.0.1.
      # Not --release: release builds leave out the Slint debug info that
      # finding the notice by its label needs (desktop/build.rs).
      - name: The update offer from a newer version on a loopback feed
        working-directory: desktop
        run: cargo test --locked --target x86_64-pc-windows-msvc a_newer_version_on_a_loopback_feed -- --nocapture

      - name: Upload the screenshot and logs (workflow artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: stranger-windows
          path: stranger-work
          if-no-files-found: warn
          retention-days: 7

  # The installed app driven through its screens, one group per job, each in
  # light and dark: the pictures pair with the Mac's LAYAR photos by name.
  # Groups: main (idle, presets list, Settings), delay (two outputs on),
  # tray (the panel from the tray icon), calibrate (the Calibrate All sheet),
  # notices (streaming on with no speaker), and on Linux nowplaying (a stand-in
  # MPRIS player's card with Shuffle and Repeat) and updates (Check for
  # Updates… on the .deb copy). not-set-up.txt names what a runner can't reach.
  shots-linux:
    name: Linux screens (${{ matrix.screens }})
    needs: [proven, linux]
    if: ${{ !cancelled() && needs.proven.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        screens: [main, delay, tray, calibrate, notices, nowplaying, updates]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stranger-linux-package
          path: pkg

      # As the stranger session, plus the accessibility bus, the AT-SPI
      # bindings, ImageMagick's import, xdotool and a tray host.
      - name: System packages and the installed package
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends pipewire pipewire-bin wireplumber pipewire-pulse             pulseaudio-utils dbus dbus-user-session xvfb libx11-xcb1 libxcursor1 libxkbcommon-x11-0 libxi6 libxrandr2             at-spi2-core python3-gi gir1.2-atspi-2.0 imagemagick xdotool stalonetray
          sudo apt-get install -y --no-install-recommends snixembed || echo "snixembed: not in the archive, the stand-in watcher hosts the tray"
          sudo apt-get install -y "./$(ls pkg/dist/AudioSync-*.deb)"
          chmod +x pkg/desktop/target/release/examples/sni_watcher_stub

      - name: Drive and photograph the ${{ matrix.screens }} screens
        env:
          GROUP: ${{ matrix.screens }}
        run: scripts/stranger/linux_shots.sh stranger-shots pkg/desktop/target/release/examples/sni_watcher_stub "$GROUP"

      - name: Upload the pictures (workflow artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: stranger-shots-linux-${{ matrix.screens }}
          path: |
            stranger-shots/*.png
            stranger-shots/*.txt
            stranger-shots/*.log
            stranger-shots/*.out
          if-no-files-found: warn
          retention-days: 7

  shots-windows:
    name: Windows screens (${{ matrix.screens }})
    needs: [proven, windows]
    if: ${{ !cancelled() && needs.proven.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        screens: [main, delay, tray, calibrate, notices]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stranger-windows-setup
          path: pkg

      - name: Install, drive and photograph the ${{ matrix.screens }} screens
        shell: pwsh
        env:
          GROUP: ${{ matrix.screens }}
        run: ./scripts/stranger/windows_shots.ps1 -Setup pkg/AudioSync-Setup.exe -Work stranger-shots -Group $env:GROUP

      - name: Upload the pictures (workflow artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: stranger-shots-windows-${{ matrix.screens }}
          path: stranger-shots
          if-no-files-found: warn
          retention-days: 7

  default-device-windows:
    # A runner with one output endpoint, the default, given by a virtual sound
    # card: volume keys, a muted output, a PC with no spare device, and the
    # default put back after a kill and an uninstall.
    name: Windows default output (taskbar volume, unmute, no spare device, restore)
    needs: [proven, windows]
    if: ${{ !cancelled() && needs.proven.outputs.skip != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stranger-windows-setup
          path: pkg

      - name: Install, stream to the default output, change its volume and mute
        shell: pwsh
        run: ./scripts/stranger/windows_default_device.ps1 -Setup pkg/AudioSync-Setup.exe -Work default-device

      - name: Upload the results and the debug log (workflow artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: stranger-windows-default-device
          path: default-device
          if-no-files-found: warn
          retention-days: 7

  memory-windows:
    # Two virtual outputs, a tone streamed to both for five minutes from the
    # installed copy: private bytes sampled every 10 s, then the uninstall
    # while it runs, with the default output, volumes and mutes as found.
    name: Windows memory while streaming (5 min), uninstall as found
    needs: [proven, windows]
    if: ${{ !cancelled() && needs.proven.outputs.skip != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stranger-windows-setup
          path: pkg

      - name: Install, stream five minutes, sample private bytes, uninstall
        shell: pwsh
        # Under the job's 25 so the upload below still runs after a hang.
        timeout-minutes: 20
        run: ./scripts/stranger/windows_memory.ps1 -Setup pkg/AudioSync-Setup.exe -Work memory

      - name: Upload the samples and the debug log (workflow artifact)
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: stranger-windows-memory
          path: memory
          if-no-files-found: warn
          retention-days: 7
