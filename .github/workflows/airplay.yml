name: AirPlay

on:
  push:
    branches: ['**', '!wip/**']
  pull_request:

# A newer push to a feature branch cancels that branch's older run; every
# commit on main keeps its own group, so main's runs are never cancelled.
# The group starts with the file name, which stays unique when a name: is copied.
concurrency:
  group: airplay.yml-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  proven:
    # main skips the rest for a commit this workflow already passed on an integ/* train.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Was this commit green on an integ/* train?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        # Any API error leaves skip=false, so main runs everything.
        run: |
          skip=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            if wf=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id) &&
              n=$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$SHA&status=success&per_page=100" \
                --jq '[.workflow_runs[] | select(.head_branch | startswith("integ/"))] | length') &&
              [ "$n" -gt 0 ] 2>/dev/null; then
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows run on main, integ/* trains and release/ branches; other pushes test on Linux only.
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integ/') || startsWith(github.ref, 'refs/heads/release/')) && '["ubuntu-latest","macos-15","windows-latest"]' || '["ubuntu-latest"]') }}
    needs: proven
    if: needs.proven.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    env:
      # Debug test builds bind every address only with this, as the apps do;
      # without it (a plain run on a desktop) they keep to loopback.
      AUDIOSYNC_LAN_TESTS: '1'
    defaults:
      run:
        shell: bash
        working-directory: airplay
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (including the spec coverage check against docs/AIRPLAY_SPEC.md)
        run: cargo test

  fake-tv-cells:
    # The weekend sheet's dry-run cells against the fake television, on
    # loopback, with the paused-cover cell cut to one minute.
    name: Fake TV cells (loopback)
    needs: proven
    if: needs.proven.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cells
        run: bash scripts/fake_tv_cells.sh --pause-minutes 1

  licenses:
    name: Licenses
    needs: proven
    if: needs.proven.outputs.skip != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airplay
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Only permissive licenses, dev-dependencies included (airplay/deny.toml)
        run: cargo deny check licenses
