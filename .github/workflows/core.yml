name: Core

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to a feature branch cancels that branch's older run; every
# commit on main keeps its own group, so main's runs are never cancelled.
# The group starts with the file name, which stays unique when a name: is copied.
concurrency:
  group: core.yml-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Debug test builds bind every address only with this, as the apps do;
      # without it (a plain run on a desktop) they keep to loopback.
      AUDIOSYNC_LAN_TESTS: '1'
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      # The Cast sender's native-tls uses the system OpenSSL on Linux.
      - name: OpenSSL headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Clippy and the probe's test with the CI-only panic probe (ffi-panic-probe feature)
        if: runner.os == 'Linux'
        run: |
          cargo clippy --all-targets --features ffi-panic-probe -- -D warnings
          cargo test --lib --features ffi-panic-probe panic_probe

      - name: Library for Apple silicon and Intel Macs
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --lib --target aarch64-apple-darwin
          cargo build --lib --target x86_64-apple-darwin

      - name: Library for x64 and Arm64 Windows
        if: runner.os == 'Windows'
        run: |
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          cargo build --lib --target x86_64-pc-windows-msvc
          cargo build --lib --target aarch64-pc-windows-msvc

      - name: Swift calls the static library through the C header
        if: runner.os == 'macOS'
        run: ffi/smoke.sh

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Only permissive licenses, dev-dependencies included (core/deny.toml)
        run: cargo deny check licenses
