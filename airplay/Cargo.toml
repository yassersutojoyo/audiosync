[package]
name = "audiosync-airplay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "AudioSync's own AirPlay sender: discovery, RTSP, SDP, digest authentication, Apple TV PIN pairing, the AirPlay 1 session, and the audio, RTP and timing of one stream to many speakers, as sans-I/O state machines driven on std threads and sockets behind a small host API."
repository = "https://github.com/yassersutojoyo/audiosync"
publish = false

[dependencies]
# Apple TV PIN pairing and pair-verify (P50 to P56, P60): RustCrypto block
# ciphers, modes, hashes and constant-time big integers, and the dalek
# curve crates. Only the features the pairing uses.
aes = { version = "0.9.2", features = ["zeroize"] }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "zeroize"] }
crypto-bigint = { version = "0.7.5", default-features = false, features = ["zeroize"] }
ctr = { version = "0.10.1", features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
getrandom = "0.4.3"
md-5 = { version = "0.11.0", default-features = false }
# Binary property lists, the bodies of the pairing requests (P47).
plist = { version = "1.8.0", default-features = false }
sha1 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
# Constant-time comparison of the SRP proof and of credentials.
subtle = { version = "2.6.1", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = "1.8.1"
# Live mDNS browsing of _raop._tcp and _airplay._tcp (P7). Without default
# features: no async runtime glue and no logging.
mdns-sd = { version = "0.21.5", default-features = false }

[dev-dependencies]
# A reference ALAC decoder for the tests (P77): the payloads the sender
# writes must decode back to the input. Without default features it pulls
# in nothing else.
alac = { version = "0.5.0", default-features = false }
