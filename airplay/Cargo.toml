[package]
name = "audiosync-airplay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "AudioSync's own AirPlay sender: discovery records, RTSP, SDP, digest authentication, the AirPlay 1 session, and the audio, RTP and timing of one stream to many speakers, as sans-I/O state machines."
repository = "https://github.com/yassersutojoyo/audiosync"
publish = false

[dependencies]
getrandom = "0.4.3"
md-5 = { version = "0.11.0", default-features = false }

[dev-dependencies]
# A reference ALAC decoder for the tests (P77): the payloads the sender
# writes must decode back to the input. Without default features it pulls
# in nothing else.
alac = { version = "0.5.0", default-features = false }
