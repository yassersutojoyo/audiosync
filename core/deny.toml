# cargo-deny configuration for audiosync-core.
#
# `cargo deny check licenses` (run from core/, and in CI) fails when any crate in
# the build graph, development dependencies included, is under a license that
# is not on this list. The core itself is GPL-3.0-or-later; third-party crates
# must be permissive.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.93
exceptions = [
    # AudioSync's own code is GPL-3.0-or-later; the exception names only our
    # own crates, so no third-party crate may bring a GPL license in.
    { crate = "audiosync-core", allow = ["GPL-3.0-or-later"] },
    { crate = "audiosync-airplay", allow = ["GPL-3.0-or-later"] },
    { crate = "audiosync-cast", allow = ["GPL-3.0-or-later"] },
    { crate = "audiosync-remote", allow = ["GPL-3.0-or-later"] },
]
# Test, benchmark and build tools are held to the same list as the library.
include-dev = true
include-build = true
# The list is a policy, not an inventory: a license nobody uses yet is fine.
unused-allowed-license = "allow"

[licenses.private]
ignore = false

# Gates main and integ/* in the Licenses job, weekly in advisories.yml; every ignore says why.
[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"

[bans]
wildcards = "deny"
# Our own crates are path dependencies without a version; none is published.
allow-wildcard-paths = true
# Duplicates come from upstream crates we do not control.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
