[package]
name = "audiosync-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Platform-independent audio core of AudioSync: delay ring buffer, drift correction, resampling, equalizer, volume and sync policy, plus the C interface of AudioSync's own AirPlay sender."
repository = "https://github.com/yassersutojoyo/audiosync"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# CI only: adds asc_airplay_panic_probe (src/panic_probe.rs), a C entry that
# panics inside an AirPlay sender call's guard, so a C program linked with
# the prelinked release library proves the panic still stops there
# (scripts/build_core.sh with AUDIOSYNC_CORE_PROBE=1, Tests/panic-probe.c).
# The app's library never has it.
ffi-panic-probe = []

[dependencies]
# AudioSync's own AirPlay sender (airplay/, MIT), reached by the macOS app
# through this crate's C interface (src/ffi/airplay.rs): the app links one
# Rust static library, so the sender comes in through the core's. Its
# third-party crates are listed in THIRD_PARTY_NOTICES.md.
audiosync-airplay = { path = "../airplay" }
# Wipes the pairing store's plaintext from memory (src/airplay_pairings.rs);
# already in the tree through the AirPlay sender.
zeroize = "1.8.1"

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11.0"

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "eq"
harness = false

[lints.clippy]
# The minimum Rust went from 1.85 to 1.88 with the AirPlay sender, which turns
# on two lints for std APIs stabilized in between (`as_chunks`,
# `is_multiple_of`). The audio code's `chunks_exact(2)` frame loops and
# `% n == 0` checks stay as they are here; moving them is a change of its own.
chunks_exact_to_as_chunks = "allow"
manual_is_multiple_of = "allow"

# Unwinding, so a bug in AudioSync's own AirPlay sender (a panic on one of
# its threads, or in a call through its C interface) stops at the
# asc_airplay_* boundary and becomes a failed sender the app restarts,
# instead of ending the app (src/ffi/airplay.rs, "Panics"). Every other
# panic still ends the app, as it did when this profile aborted:
# - one that reaches any other extern "C" function aborts there: since
#   Rust 1.81 unwinding out of an extern "C" function aborts the process, so
#   it never unwinds into the host (rust-version is above that);
# - a thread the core spawns runs its body under catch_unwind and aborts the
#   process on a panic, unless the thread reports its own death to the host
#   the way the sender's threads do. Unwinding would otherwise end only that
#   thread, silently: a new thread follows the same rule.
[profile.release]
panic = "unwind"

# The drift simulation plays two hours of audio per direction through the
# ring; opt-level 1 runs it in about a second instead of half a minute and
# keeps debug assertions and overflow checks on.
[profile.test]
opt-level = 1
