[package]
name = "audiosync-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Platform-independent audio core of AudioSync: delay ring buffer, drift correction, resampling, equalizer, volume, sync policy and PCM16 conversion."
repository = "https://github.com/yassersutojoyo/audiosync"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11.0"

[[bench]]
name = "pipeline"
harness = false

[profile.release]
panic = "abort"

# The drift simulation plays two hours of audio per direction through the
# ring; opt-level 1 runs it in about a second instead of half a minute and
# keeps debug assertions and overflow checks on.
[profile.test]
opt-level = 1
